# B2. Thu thập ảnh (docs/nhan-dang-robot/00-ke-hoach.md mục 8, B2).

target_ok: 450            # dừng tải một lớp khi đã có chừng này ảnh tải được (kế hoạch: 400 ảnh thô, tối đa 600)
max_attempts: 700         # số URL thử tối đa mỗi lớp
max_side: 512             # thu ảnh về cạnh dài 512 px (Pillow, LANCZOS), lưu JPEG chất lượng 90
jpeg_quality: 90
max_bytes: 20000000       # bỏ file lớn hơn 20 MB
workers: 12               # số luồng tải song song
per_host_interval: 1.0    # giây tối thiểu giữa hai yêu cầu tới cùng một máy chủ
# Ngoại lệ: CDN ảnh của fandom chịu tải lớn nên cho 4 yêu cầu/giây.
host_intervals:
  static.wikia.nocookie.net: 0.25
# Không gửi yêu cầu nào tới các host này. TFWiki: robots.txt không cho tải thư mục ảnh, và ngày 07/11/2026 máy chủ báo
# tạm chặn vì lưu lượng lớn (sau B1 và lần chạy thử B2a). Ảnh wiki của Transformers lấy từ Teletraan I (fandom).
blocked_hosts: [tfwiki.net]
timeout: [8, 15]          # (kết nối, đọc) giây
retries: 2                # thử lại khi lỗi mạng hoặc HTTP 5xx/429 (backoff mũ); hết thời gian thì không thử lại
respect_robots_txt: true
active_classes: 4         # số lớp tải đồng thời (luồng tải không phải chờ lớp chậm nhất)

# Wiki lấy ảnh theo franchise: Transformers dùng Teletraan I (transformers.fandom.com) thay cho TFWiki; tên trang của
# B1 (theo TFWiki) được giải theo chuyển hướng của Teletraan I, ví dụ "Optimus Prime (G1)" → "Optimus Prime (Primax)".
image_wikis:
  transformers: {api: "https://transformers.fandom.com/api.php", page_url: "https://transformers.fandom.com/wiki/", label: "Teletraan I (fandom)"}

sources:
  wiki:
    max_per_class: 250
    extensions: [jpg, jpeg, png, webp, gif]
    subpages: {}
  ddg:
    max_per_class: 400
    pages: 4              # 4 trang kết quả, mỗi trang khoảng 35 ảnh
    delay: 3.5            # giây giữa hai lần gọi (1,5 và 2 giây bị giới hạn tốc độ liên tục, mỗi lần phạt chờ 10–80 giây)
    safesearch: moderate
  bing:
    enabled: false        # loại: trả kết quả không khớp truy vấn (xem báo cáo B02)

# Mẫu truy vấn DuckDuckGo theo franchise. {name}: tên robot; {kw}: từ khoá dòng; {alias}: tên khác (nếu có).
queries:
  transformers:
    - "{name} transformers {kw}"
    - "{name} transformers {kw} toy"
    - "{name} transformers {kw} figure"
    - "{name} transformers {kw} {medium}"
    - "{name} transformers {kw} robot mode"
    - "{name} transformers {kw} review"
  gundam:
    - "{name}"
    - "{name} gunpla"
    - "{name} model kit"
    - "{name} anime"
    - "{name} mobile suit"
    - "{name} figure"
  sentai:
    - "{name}"
    - "{name} {kw}"
    - "{name} toy"
    - "DX {name}"
    - "{name} robot"
    - "{alias}"
    - "{alias} super sentai"
    - "DX {alias}"

# Từ khoá dòng (kw) và loại hình (medium) cho Transformers theo nhóm.
tf_keywords:
  g1: {kw: "G1", medium: "cartoon"}
  movie: {kw: "movie", medium: "film"}
  aligned: {kw: "Prime", medium: "animated series"}
  bw: {kw: "Beast Wars", medium: "cartoon"}
  animated: {kw: "Animated", medium: "cartoon"}
  cyberverse: {kw: "Cyberverse", medium: "cartoon"}
  earthspark: {kw: "EarthSpark", medium: "cartoon"}
  one: {kw: "One", medium: "movie"}

# Chạy thử trên vài lớp trước khi chạy đủ (--pilot)
pilot:
  - transformers-optimus-prime-g1
  - transformers-groove-g1
  - gundam-rx-78-2-gundam
  - gundam-eb-06-graze
  - sentai-wild-force-megazord
  - sentai-goggle-robo

