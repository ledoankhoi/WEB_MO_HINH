# B6. Huấn luyện chính (docs/nhan-dang-robot/00-ke-hoach.md mục 8, B6; thí nghiệm E2).

seeds: [42, 43, 44]
order: [convnext_tiny, efficientnetv2_s, vit_b16_clip]   # thứ tự chạy khi dùng --all (mỗi kiến trúc đủ 3 hạt giống rồi mới sang kiến trúc sau)

# Trọng số huấn luyện sẵn của timm. Hai CNN dùng bản học trên ImageNet-21k/22k rồi tinh chỉnh ImageNet-1k để công bằng với nhau;
# ViT khởi tạo từ phần ảnh của CLIP (OpenAI). Tốc độ học của pha 2 khác nhau theo kế hoạch.
architectures:
  convnext_tiny: {label: "ConvNeXt-Tiny", timm: convnext_tiny.fb_in22k_ft_in1k, lr: 1.0e-4, layer_decay: null}
  efficientnetv2_s: {label: "EfficientNetV2-S", timm: tf_efficientnetv2_s.in21k_ft_in1k, lr: 1.0e-4, layer_decay: null}
  vit_b16_clip: {label: "ViT-B/16 (CLIP)", timm: vit_base_patch16_clip_224.openai, lr: 3.0e-5, layer_decay: 0.75}

train:
  epochs_head: 2          # pha 1: chỉ đầu phân loại, thân mạng đóng băng
  epochs_max: 30          # tổng số epoch tối đa (gồm cả pha 1)
  lr_head: 1.0e-3
  weight_decay: 0.05
  betas: [0.9, 0.999]
  warmup_epochs: 1        # pha 2: khởi động tuyến tính 1 epoch rồi cosine
  batch_size: 64          # số ảnh mỗi bước tối ưu
  micro_batch: 64         # GPU dưới 10 GB (máy này 4 GB) tự đổi thành 32 và cộng dồn gradient 2 lần
  label_smoothing: 0.1
  sampler_power: 0.5      # lớp c được lấy với xác suất tỉ lệ n_c^0,5
  grad_clip: 1.0
  patience: 5             # dừng sớm khi macro-F1 trên val không tăng 5 epoch liền
  amp: true               # fp16 (B00: fp32 chậm 8–16 lần và tràn bộ nhớ GPU 4 GB)
  save_half: false        # best.pt lưu fp32: bản fp16 làm kết quả đánh giá lại lệch so với lúc huấn luyện (chạy thử 12/11: EfficientNetV2-S top-1 2,34% thành 2,54%)
  eval_batch: 128

aug: {crop_scale: [0.35, 1.0], randaugment: true, ra_ops: 2, ra_magnitude: 9, color_jitter: 0.3, erasing: 0.25}
image: {size: 224, resize: 256}

# Chạy thử nhanh (--smoke): một phần nhỏ dữ liệu, 2 epoch, để kiểm tra đường ống và đo tốc độ trước khi chạy thật.
smoke: {train_images: 1536, val_images: 512, epochs_head: 1, epochs_max: 2}
